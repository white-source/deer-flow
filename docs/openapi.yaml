openapi: 3.1.0
info:
  title: DeerFlow API
  description: 'DeerFlow — LangGraph-based AI Super Agent System.


    Backend Gateway API providing:

    - **Agent Execution** — stream / wait / cancel runs on threads

    - **Thread Management** — CRUD, state, history, messages, token tracking

    - **Memory** — persistent cross-conversation facts and context

    - **Skills** — install, enable, disable, and manage agent skills

    - **MCP** — Model Context Protocol server configuration

    - **File Uploads** — with automatic PDF/Word/PPT/Excel conversion

    - **Artifacts** — agent-generated file serving

    - **IM Channels** — Feishu, Slack, Telegram, DingTalk integration

    - **Custom Agents** — create and manage user-defined agents'
  version: 0.1.0
paths:
  /api/models:
    get:
      tags:
      - Models
      summary: List All Models
      description: Retrieve a list of all available AI models configured in the system.
      operationId: list_models_api_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsListResponse'
  /api/models/{model_name}:
    get:
      tags:
      - Models
      summary: Get Model Details
      description: Retrieve detailed information about a specific AI model by its name.
      operationId: get_model_api_models__model_name__get
      parameters:
      - name: model_name
        in: path
        required: true
        schema:
          type: string
          title: Model Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mcp/config:
    get:
      tags:
      - MCP
      summary: Get MCP Configuration
      description: Retrieve the current Model Context Protocol (MCP) server configurations.
      operationId: get_mcp_configuration_api_mcp_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConfigResponse'
    put:
      tags:
      - MCP
      summary: Update MCP Configuration
      description: Update Model Context Protocol (MCP) server configurations and save to file.
      operationId: update_mcp_configuration_api_mcp_config_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpConfigUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConfigResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/memory:
    get:
      tags:
      - Memory
      summary: Get Memory Data
      description: Retrieve the current global memory data including user context, history, and facts.
      operationId: get_memory_api_memory_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
    delete:
      tags:
      - Memory
      summary: Clear All Memory Data
      description: Delete all saved memory data and reset the memory structure to an empty state.
      operationId: clear_memory_api_memory_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
  /api/memory/reload:
    post:
      tags:
      - Memory
      summary: Reload Memory Data
      description: Reload memory data from the storage file, refreshing the in-memory cache.
      operationId: reload_memory_api_memory_reload_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
  /api/memory/facts:
    post:
      tags:
      - Memory
      summary: Create Memory Fact
      description: Create a single saved memory fact manually.
      operationId: create_memory_fact_endpoint_api_memory_facts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/memory/facts/{fact_id}:
    delete:
      tags:
      - Memory
      summary: Delete Memory Fact
      description: Delete a single saved memory fact by its fact id.
      operationId: delete_memory_fact_endpoint_api_memory_facts__fact_id__delete
      parameters:
      - name: fact_id
        in: path
        required: true
        schema:
          type: string
          title: Fact Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Memory
      summary: Patch Memory Fact
      description: Partially update a single saved memory fact by its fact id while preserving omitted fields.
      operationId: update_memory_fact_endpoint_api_memory_facts__fact_id__patch
      parameters:
      - name: fact_id
        in: path
        required: true
        schema:
          type: string
          title: Fact Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/memory/export:
    get:
      tags:
      - Memory
      summary: Export Memory Data
      description: Export the current global memory data as JSON for backup or transfer.
      operationId: export_memory_api_memory_export_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
  /api/memory/import:
    post:
      tags:
      - Memory
      summary: Import Memory Data
      description: Import and overwrite the current global memory data from a JSON payload.
      operationId: import_memory_api_memory_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryResponse'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/memory/config:
    get:
      tags:
      - Memory
      summary: Get Memory Configuration
      description: Retrieve the current memory system configuration.
      operationId: get_memory_config_endpoint_api_memory_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryConfigResponse'
  /api/memory/status:
    get:
      tags:
      - Memory
      summary: Get Memory Status
      description: Retrieve both memory configuration and current data in a single request.
      operationId: get_memory_status_api_memory_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryStatusResponse'
  /api/skills:
    get:
      tags:
      - Skills
      summary: List All Skills
      description: Retrieve a list of all available skills from both public and custom directories.
      operationId: list_skills_api_skills_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsListResponse'
  /api/skills/install:
    post:
      tags:
      - Skills
      summary: Install Skill
      description: Install a skill from a .skill file (ZIP archive) located in the thread's user-data directory.
      operationId: install_skill_api_skills_install_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillInstallRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInstallResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills/custom:
    get:
      tags:
      - Skills
      summary: List Custom Skills
      operationId: list_custom_skills_api_skills_custom_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsListResponse'
  /api/skills/custom/{skill_name}:
    get:
      tags:
      - Skills
      summary: Get Custom Skill Content
      operationId: get_custom_skill_api_skills_custom__skill_name__get
      parameters:
      - name: skill_name
        in: path
        required: true
        schema:
          type: string
          title: Skill Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomSkillContentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Skills
      summary: Edit Custom Skill
      operationId: update_custom_skill_api_skills_custom__skill_name__put
      parameters:
      - name: skill_name
        in: path
        required: true
        schema:
          type: string
          title: Skill Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomSkillUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomSkillContentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Skills
      summary: Delete Custom Skill
      operationId: delete_custom_skill_api_skills_custom__skill_name__delete
      parameters:
      - name: skill_name
        in: path
        required: true
        schema:
          type: string
          title: Skill Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                title: Response Delete Custom Skill Api Skills Custom  Skill Name  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills/custom/{skill_name}/history:
    get:
      tags:
      - Skills
      summary: Get Custom Skill History
      operationId: get_custom_skill_history_api_skills_custom__skill_name__history_get
      parameters:
      - name: skill_name
        in: path
        required: true
        schema:
          type: string
          title: Skill Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomSkillHistoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills/custom/{skill_name}/rollback:
    post:
      tags:
      - Skills
      summary: Rollback Custom Skill
      operationId: rollback_custom_skill_api_skills_custom__skill_name__rollback_post
      parameters:
      - name: skill_name
        in: path
        required: true
        schema:
          type: string
          title: Skill Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillRollbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomSkillContentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills/{skill_name}:
    get:
      tags:
      - Skills
      summary: Get Skill Details
      description: Retrieve detailed information about a specific skill by its name.
      operationId: get_skill_api_skills__skill_name__get
      parameters:
      - name: skill_name
        in: path
        required: true
        schema:
          type: string
          title: Skill Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Skills
      summary: Update Skill
      description: Update a skill's enabled status by modifying the extensions_config.json file.
      operationId: update_skill_api_skills__skill_name__put
      parameters:
      - name: skill_name
        in: path
        required: true
        schema:
          type: string
          title: Skill Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads/{thread_id}/artifacts/{path}:
    get:
      tags:
      - Artifacts
      summary: Get Artifact File
      description: Retrieve an artifact file generated by the AI agent. Text and binary files can be viewed inline, while
        active web content is always downloaded.
      operationId: get_artifact_api_threads__thread_id__artifacts__path__get
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Download
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads/{thread_id}/uploads:
    post:
      tags:
      - Uploads
      summary: Upload Files
      description: Upload multiple files to a thread's uploads directory.
      operationId: upload_files_api_threads__thread_id__uploads_post
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_files_api_threads__thread_id__uploads_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads/{thread_id}/uploads/limits:
    get:
      tags:
      - Uploads
      summary: Get Upload Limits
      description: Return upload limits used by the gateway for this thread.
      operationId: get_upload_limits_api_threads__thread_id__uploads_limits_get
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLimits'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads/{thread_id}/uploads/list:
    get:
      tags:
      - Uploads
      summary: List Uploaded Files
      description: List all files in a thread's uploads directory.
      operationId: list_uploaded_files_api_threads__thread_id__uploads_list_get
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Uploaded Files Api Threads  Thread Id  Uploads List Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads/{thread_id}/uploads/{filename}:
    delete:
      tags:
      - Uploads
      summary: Delete Uploaded File
      description: Delete a file from a thread's uploads directory.
      operationId: delete_uploaded_file_api_threads__thread_id__uploads__filename__delete
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Uploaded File Api Threads  Thread Id  Uploads  Filename  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads/{thread_id}:
    delete:
      tags:
      - Threads
      summary: Delete Thread Data
      description: 'Delete local persisted filesystem data for a thread.


        Cleans DeerFlow-managed thread directories, removes checkpoint data,

        and removes the thread_meta row from the configured ThreadMetaStore

        (sqlite or memory).'
      operationId: delete_thread_data_api_threads__thread_id__delete
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Threads
      summary: Patch Thread
      description: Merge metadata into a thread record.
      operationId: patch_thread_api_threads__thread_id__patch
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Threads
      summary: Get Thread
      description: 'Get thread info.


        Reads metadata from the ThreadMetaStore and derives the accurate

        execution status from the checkpointer.  Falls back to the checkpointer

        alone for threads that pre-date ThreadMetaStore adoption (backward compat).'
      operationId: get_thread_api_threads__thread_id__get
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads:
    post:
      tags:
      - Threads
      summary: Create Thread
      description: 'Create a new thread.


        Writes a thread_meta record (so the thread appears in /threads/search)

        and an empty checkpoint (so state endpoints work immediately).

        Idempotent: returns the existing record when ``thread_id`` already exists.'
      operationId: create_thread_api_threads_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads/search:
    post:
      tags:
      - Threads
      summary: Search Threads
      description: 'Search and list threads.


        Delegates to the configured ThreadMetaStore implementation

        (SQL-backed for sqlite/postgres, Store-backed for memory mode).'
      operationId: search_threads_api_threads_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ThreadResponse'
                type: array
                title: Response Search Threads Api Threads Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads/{thread_id}/state:
    get:
      tags:
      - Threads
      summary: Get Thread State
      description: 'Get the latest state snapshot for a thread.


        Channel values are serialized to ensure LangChain message objects

        are converted to JSON-safe dicts.'
      operationId: get_thread_state_api_threads__thread_id__state_get
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Threads
      summary: Update Thread State
      description: 'Update thread state (e.g. for human-in-the-loop resume or title rename).


        Writes a new checkpoint that merges *body.values* into the latest

        channel values, then syncs any updated ``title`` field through the

        ThreadMetaStore abstraction so that ``/threads/search`` reflects the

        change immediately in both sqlite and memory backends.'
      operationId: update_thread_state_api_threads__thread_id__state_post
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadStateUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/threads/{thread_id}/history:
    post:
      tags:
      - Threads
      summary: Get Thread History
      description: 'Get checkpoint history for a thread.


        Messages are read from the checkpointer''s channel values (the

        authoritative source) and serialized via

        :func:`~deerflow.runtime.serialization.serialize_channel_values`.

        Only the latest (first) checkpoint carries the ``messages`` key to

        avoid duplicating them across every entry.'
      operationId: get_thread_history_api_threads__thread_id__history_post
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadHistoryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEntry'
                title: Response Get Thread History Api Threads  Thread Id  History Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agents:
    get:
      tags:
      - Agents
