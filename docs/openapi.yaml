          type: integer
          title: Max File Size
        max_total_size:
          type: integer
          title: Max Total Size
      type: object
      required:
      - max_files
      - max_file_size
      - max_total_size
      title: UploadLimits
      description: Application-level upload limits exposed to clients.
    UploadResponse:
      properties:
        success:
          type: boolean
          title: Success
        files:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Files
        message:
          type: string
          title: Message
