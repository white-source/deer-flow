        total_input_tokens:
          type: integer
          title: Total Input Tokens
          default: 0
        total_output_tokens:
          type: integer
          title: Total Output Tokens
          default: 0
        total_runs:
          type: integer
          title: Total Runs
          default: 0
        by_model:
          additionalProperties:
